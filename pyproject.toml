[project]
name = "dedalus-docs-mcp-server"
version = "1.0.0"
description = "MCP server for serving and querying documentation"
requires-python = ">=3.10"
dependencies = [
    "dedalus-mcp>=0.2.4",
    # Data validation & serialization
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project.scripts]
main = "src.main:main"